name: Frontend CI and image
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '26'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Validate
        run: |
          cd frontend
          npm ci
          npm test -- --watch=false
          npm run build
  image:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          platforms: linux/amd64
          tags: |
            ghcr.io/${{ github.repository }}:main
            ghcr.io/${{ github.repository }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
  deploy:
    if: vars.CV_DEPLOY_ENABLED == 'true'
    needs: image
    runs-on: ubuntu-latest
    timeout-minutes: 2
    environment: production
    steps:
      - name: Queue deployment in Coolify
        env:
          COOLIFY_DEPLOY_URL: ${{ secrets.COOLIFY_DEPLOY_URL }}
          COOLIFY_DEPLOY_TOKEN: ${{ secrets.COOLIFY_DEPLOY_TOKEN }}
        run: |
          test -n "$COOLIFY_DEPLOY_URL" && test -n "$COOLIFY_DEPLOY_TOKEN"
          curl --request POST --fail --silent --show-error --connect-timeout 10 --max-time 40 \
            --output /dev/null --header "Authorization: Bearer $COOLIFY_DEPLOY_TOKEN" "$COOLIFY_DEPLOY_URL"
